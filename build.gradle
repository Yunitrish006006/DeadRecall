plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def totemCoreJar = file(providers.gradleProperty("totemCoreJar")
        .getOrElse("../TotemCore/build/libs/totem-core-0.6.1.jar"))
def bundleModuleDirectory = providers.gradleProperty("bundleModuleDirectory")
        .map { path -> file(path) }
        .orNull
def bundledModuleNames = [
        "totem-core-0.6.1.jar",
        "totem-remnant-0.2.12.jar",
        "totem-discord-bridge-0.1.7.jar",
        "totem-automata-0.1.13.jar",
        "totem-alchemy-0.1.24.jar",
        "totem-enchanting-0.1.7.jar",
        "totem-excavation-0.1.3.jar",
        "totem-locksmith-0.1.1.jar",
        "totem-vanilla-tweaks-0.1.9.jar",
        "totem-nexus-0.2.7.jar",
        "totem-villagers-0.1.31.jar"
]
def bundledModuleFiles = bundleModuleDirectory == null
        ? []
        : bundledModuleNames.collect { name -> new File(bundleModuleDirectory, name) }

if (bundleModuleDirectory != null) {
    def missingModules = bundledModuleFiles.findAll { moduleJar -> !moduleJar.isFile() }
    if (!missingModules.isEmpty()) {
        throw new GradleException(
                "Missing standalone module JARs for bundled build: "
                        + missingModules.collect { it.absolutePath }.join(", ")
        )
    }
}

sourceSets {
    main {
        java {
            setSrcDirs(["src/main/java"])
            include "com/adaptor/deadrecall/Deadrecall.java"
            include "com/adaptor/deadrecall/migration/**"
        }
        resources {
            setSrcDirs(["src/main/resources"])
            include "fabric.mod.json"
            include "assets/deadrecall/icon.png"
            include "data/deadrecall/migration/item_ids.json"
        }
    }
    test {
        java.setSrcDirs(["src/thinTest/java"])
        resources.setSrcDirs(["src/thinTest/resources"])
    }
}

loom {
    mods {
        "deadrecall" {
            sourceSet sourceSets.main
        }
    }
    runs {
        server {
            programArg "--nogui"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = "https://repo.codemc.io/repository/relativitymc/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation files(totemCoreJar)

    // When assembling or smoke-testing a full bundle, make the exact external
    // module graph available to Loom's development server as normal Fabric mods.
    // Core is already present through modImplementation above.
    if (bundleModuleDirectory != null) {
        modRuntimeOnly files(bundledModuleFiles.findAll { moduleJar ->
            moduleJar.name != "totem-core-0.6.1.jar"
        })
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("processResources", ProcessResources) {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version
        )
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(25)
}

tasks.named("jar", Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

def verifyDeadRecallThinJar = tasks.register("verifyDeadRecallThinJar") {
    group = "verification"
    description = "Rejects gameplay, client, Mixin, Payload, GUI and fallback classes in the DeadRecall host JAR."
    dependsOn(tasks.named("jar"))

    doLast {
        File archive = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def allowedClassPrefixes = [
                "com/adaptor/deadrecall/Deadrecall.class",
                "com/adaptor/deadrecall/migration/"
        ]
        def forbiddenEntries = []
        def jarFile = new java.util.jar.JarFile(archive)
        try {
            jarFile.entries().each { entry ->
                if (entry.name.endsWith(".class")
                        && !allowedClassPrefixes.any { prefix -> entry.name.startsWith(prefix) }) {
                    forbiddenEntries.add(entry.name)
                }
                if (entry.name.endsWith(".mixins.json")
                        || (!entry.isDirectory()
                            && entry.name.startsWith("data/")
                            && entry.name != "data/deadrecall/migration/item_ids.json")
                        || (!entry.isDirectory()
                            && entry.name.startsWith("assets/")
                            && entry.name != "assets/deadrecall/icon.png")) {
                    forbiddenEntries.add(entry.name)
                }
            }
        } finally {
            jarFile.close()
        }
        if (!forbiddenEntries.isEmpty()) {
            throw new GradleException(
                    "DeadRecall host JAR contains non-migration functionality: "
                            + forbiddenEntries.sort().join(", ")
            )
        }
    }
}

def bundleJar = tasks.register("bundleJar") {
    group = "build"
    description = "Packages the exact Totem module graph as Fabric nested JARs."
    dependsOn(verifyDeadRecallThinJar)

    def thinJar = tasks.named("jar", Jar).flatMap { it.archiveFile }
    def bundledJar = layout.buildDirectory.file(
            "libs/${project.archives_base_name}-${project.version}-bundled.jar"
    )
    inputs.file(thinJar)
    inputs.files(bundledModuleFiles)
    outputs.file(bundledJar)

    onlyIf {
        if (bundleModuleDirectory == null) {
            throw new GradleException("bundleJar requires -PbundleModuleDirectory=<directory>")
        }
        true
    }

    doLast {
        File sourceFile = thinJar.get().asFile
        File outputFile = bundledJar.get().asFile
        File temporaryFile = new File(outputFile.parentFile, "${outputFile.name}.tmp")
        def source = new java.util.jar.JarFile(sourceFile)

        try {
            def metadataEntry = source.getJarEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("DeadRecall JAR is missing fabric.mod.json")
            }
            def metadata = new groovy.json.JsonSlurper().parse(source.getInputStream(metadataEntry))
            metadata.jars = bundledModuleFiles.collect { moduleJar ->
                [file: "META-INF/jars/${moduleJar.name}"]
            }
            def exactDependencies = new LinkedHashMap(metadata.depends ?: [:])
            def seenModuleIds = new LinkedHashSet<String>()
            bundledModuleFiles.each { moduleJar ->
                def moduleArchive = new java.util.jar.JarFile(moduleJar)
                try {
                    def moduleMetadataEntry = moduleArchive.getJarEntry("fabric.mod.json")
                    if (moduleMetadataEntry == null) {
                        throw new GradleException("Bundled module is missing fabric.mod.json: ${moduleJar}")
                    }
                    def moduleMetadata = new groovy.json.JsonSlurper().parse(
                            moduleArchive.getInputStream(moduleMetadataEntry)
                    )
                    String moduleId = moduleMetadata.id
                    String moduleVersion = moduleMetadata.version
                    if (moduleId == null || moduleId.isBlank() || moduleVersion == null || moduleVersion.isBlank()) {
                        throw new GradleException("Bundled module has incomplete id/version metadata: ${moduleJar}")
                    }
                    if (!seenModuleIds.add(moduleId)) {
                        throw new GradleException("Bundled module id is duplicated: ${moduleId}")
                    }
                    exactDependencies[moduleId] = "=${moduleVersion}"
                } finally {
                    moduleArchive.close()
                }
            }
            metadata.depends = exactDependencies
            byte[] metadataBytes = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(metadata)
            ).getBytes(java.nio.charset.StandardCharsets.UTF_8)

            def output = new java.util.zip.ZipOutputStream(
                    new java.io.BufferedOutputStream(new java.io.FileOutputStream(temporaryFile))
            )
            try {
                def entries = source.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (entry.name == "fabric.mod.json") {
                        continue
                    }
                    def bundledEntry = new java.util.zip.ZipEntry(entry.name)
                    bundledEntry.setTime(0L)
                    output.putNextEntry(bundledEntry)
                    if (!entry.directory) {
                        source.getInputStream(entry).withCloseable { input ->
                            input.transferTo(output)
                        }
                    }
                    output.closeEntry()
                }

                def bundledMetadataEntry = new java.util.zip.ZipEntry("fabric.mod.json")
                bundledMetadataEntry.setTime(0L)
                output.putNextEntry(bundledMetadataEntry)
                output.write(metadataBytes)
                output.closeEntry()

                bundledModuleFiles.each { moduleJar ->
                    def nestedEntry = new java.util.zip.ZipEntry("META-INF/jars/${moduleJar.name}")
                    nestedEntry.setTime(0L)
                    output.putNextEntry(nestedEntry)
                    moduleJar.withInputStream { input ->
                        input.transferTo(output)
                    }
                    output.closeEntry()
                }
            } finally {
                output.close()
            }
        } finally {
            source.close()
        }

        java.nio.file.Files.move(
                temporaryFile.toPath(),
                outputFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

if (bundleModuleDirectory != null) {
    tasks.named("build") {
        dependsOn(bundleJar)
    }
}

apply from: "gradle/normalize-fabric-api-runtime.gradle"

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}