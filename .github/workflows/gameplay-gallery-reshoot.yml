name: Gameplay Gallery Reshoot

on:
  push:
    branches:
      - gallery/gameplay-reshoot-2.4.21
    paths:
      - '.github/workflows/gameplay-gallery-reshoot.yml'
      - '.github/scripts/capture-existing-client-gallery.sh'
      - '.github/gallery-harness/**'
      - 'docs/modrinth-gallery-shot-list-2.4.21.md'
  pull_request:
    paths:
      - '.github/workflows/gameplay-gallery-reshoot.yml'
      - '.github/scripts/capture-existing-client-gallery.sh'
      - '.github/gallery-harness/**'
      - 'docs/modrinth-gallery-shot-list-2.4.21.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-gameplay-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out DeadRecall gallery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build exact DeadRecall 2.4.21 module graph
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew .github/scripts/build-current-bundle.sh .github/scripts/capture-existing-client-gallery.sh
          .github/scripts/build-current-bundle.sh

      - name: Re-shoot existing client visual suites
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/capture-existing-client-gallery.sh

      - name: Re-shoot missing module gameplay showcases
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew \
            -p .github/gallery-harness \
            -PmoduleDir="${GITHUB_WORKSPACE}/standalone-modules" \
            runClientGameTest --no-daemon --stacktrace

      - name: Verify capture coverage
        shell: bash
        run: |
          set -euo pipefail
          existing='test-artifacts/gameplay-gallery/existing-client-tests'
          harness='test-artifacts/gameplay-gallery/gallery-harness'
          for module in totem-alchemy totem-automata totem-nexus totem-villagers totem-remnant totem-locksmith; do
            count="$(find "$existing/$module" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
            echo "$module existing visual captures: $count"
            test "$count" -gt 0
          done
          test -d "$harness"
          for module in totem-core totem-enchanting totem-excavation totem-vanilla-tweaks totem-discord-bridge; do
            count="$(find "$harness" -maxdepth 1 -type f -name "*gallery-${module}-*.png" | wc -l | tr -d ' ')"
            echo "$module harness captures: $count"
            test "$count" -ge 2
          done
          find test-artifacts/gameplay-gallery -type f -name '*.png' -print | sort > test-artifacts/gameplay-gallery/all-screenshots.txt
          echo "Total fresh screenshots: $(wc -l < test-artifacts/gameplay-gallery/all-screenshots.txt)"

      - name: Upload fresh gameplay captures
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-gallery-reshoot-2.4.21
          path: test-artifacts/gameplay-gallery/
          if-no-files-found: error
          retention-days: 14
