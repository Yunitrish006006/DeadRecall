name: Publish Modrinth

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without creating a Modrinth version
        required: true
        default: true
        type: boolean
      version_type:
        description: Modrinth release channel
        required: true
        default: auto
        type: choice
        options:
          - auto
          - release
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: deadrecall-modrinth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, smoke, and publish current bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out DeadRecall
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build exact lockstep bundle
        shell: bash
        run: bash .github/scripts/build-current-bundle.sh

      - name: Dedicated server smoke
        shell: bash
        run: bash .github/scripts/smoke-current-bundle-server.sh

      - name: Validate current Modrinth artifact
        shell: bash
        env:
          MODRINTH_DRY_RUN: 'true'
          MODRINTH_ARTIFACT: ${{ env.DEADRECALL_BUNDLE_ARTIFACT }}
          MODRINTH_VERSION_TYPE: ${{ inputs.version_type }}
        run: bash .github/scripts/publish-modrinth.sh

      - name: Validate Modrinth presentation
        shell: bash
        env:
          MODRINTH_PROJECT_DRY_RUN: 'true'
        run: bash .github/scripts/sync-modrinth-project.sh

      - name: Verify Modrinth credentials
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MODRINTH_PROJECT_ID}" || {
            echo 'Repository variable MODRINTH_PROJECT_ID is not configured.' >&2
            exit 1
          }
          test -n "${MODRINTH_TOKEN}" || {
            echo 'Repository secret MODRINTH_TOKEN is not configured.' >&2
            exit 1
          }

      - name: Sync Modrinth project presentation
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          MODRINTH_PROJECT_DRY_RUN: 'false'
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/sync-modrinth-project.sh

      - name: Publish current bundle to Modrinth
        if: ${{ inputs.dry_run == false }}
        id: modrinth
        shell: bash
        env:
          MODRINTH_DRY_RUN: 'false'
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_VERSION_TYPE: ${{ inputs.version_type }}
          MODRINTH_ARTIFACT: ${{ env.DEADRECALL_BUNDLE_ARTIFACT }}
        run: bash .github/scripts/publish-modrinth.sh

      - name: Verify published artifact
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_VERSION_ID: ${{ steps.modrinth.outputs.version_id }}
          MODRINTH_ARTIFACT: ${{ env.DEADRECALL_BUNDLE_ARTIFACT }}
        run: |
          set -euo pipefail
          test -n "${MODRINTH_VERSION_ID}"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          expected_sha512="$(sha512sum "${MODRINTH_ARTIFACT}" | awk '{print $1}')"
          response="$(mktemp)"
          trap 'rm -f "${response}"' EXIT
          curl --silent --show-error --fail --retry 3 \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${GITHUB_REPOSITORY}-GitHubActions/${GITHUB_RUN_ID}" \
            --output "${response}" \
            "https://api.modrinth.com/v2/version/${MODRINTH_VERSION_ID}"
          jq -e \
            --arg project_id "${MODRINTH_PROJECT_ID}" \
            --arg version "${version}" \
            --arg filename "deadrecall-${version}-bundled.jar" \
            --arg sha512 "${expected_sha512}" '
              .project_id == $project_id
              and .version_number == $version
              and .environment == "client_and_server"
              and .game_versions == ["26.2"]
              and .loaders == ["fabric"]
              and (([.files[] | select(.primary == true)][0] // .files[0]).filename == $filename)
              and (([.files[] | select(.primary == true)][0] // .files[0]).hashes.sha512 == $sha512)
            ' "${response}" >/dev/null
          printf 'Verified DeadRecall %s remote artifact SHA-512.\n' "${version}"

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadrecall-current-bundle-failure
          if-no-files-found: ignore
          path: |
            server-smoke.log
            build/current-bundle.fabric.mod.json
            run/logs/
            **/build/reports/
