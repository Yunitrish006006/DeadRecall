name: Bundle Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - build.gradle
      - gradle.properties
      - src/main/resources/fabric.mod.json
      - .github/scripts/build-current-bundle.sh
      - .github/scripts/smoke-current-bundle-server.sh
      - .github/scripts/publish-modrinth.sh
      - .github/workflows/bundle-smoke.yml
      - .github/workflows/publish-modrinth.yml
  push:
    branches:
      - master
    paths:
      - build.gradle
      - gradle.properties
      - src/main/resources/fabric.mod.json
      - .github/scripts/build-current-bundle.sh
      - .github/scripts/smoke-current-bundle-server.sh
      - .github/scripts/publish-modrinth.sh
      - .github/workflows/bundle-smoke.yml
      - .github/workflows/publish-modrinth.yml

permissions:
  contents: read

jobs:
  current-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out DeadRecall
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build exact lockstep bundle
        shell: bash
        run: bash .github/scripts/build-current-bundle.sh

      - name: Dedicated server smoke
        shell: bash
        run: bash .github/scripts/smoke-current-bundle-server.sh

      - name: Validate Modrinth dry run
        shell: bash
        env:
          MODRINTH_DRY_RUN: 'true'
          MODRINTH_ARTIFACT: ${{ env.DEADRECALL_BUNDLE_ARTIFACT }}
        run: bash .github/scripts/publish-modrinth.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadrecall-bundle-smoke-failure
          if-no-files-found: ignore
          path: |
            server-smoke.log
            build/current-bundle.fabric.mod.json
            run/logs/
            **/build/reports/
