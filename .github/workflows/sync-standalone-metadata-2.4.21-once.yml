name: Sync Standalone Metadata 2.4.21 Once

on:
  push:
    branches: [master]
    paths: [.github/workflows/sync-standalone-metadata-2.4.21-once.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download verified 2.4.21 bundle
        uses: actions/download-artifact@v4
        with:
          name: deadrecall-2.4.21-bundled
          path: release-bundle
          repository: Yunitrish006006/DeadRecall
          run-id: 32250556863
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage current manifest and bundle
        shell: bash
        run: |
          set -euo pipefail
          marker='.github/staging/modrinth-standalone-published-2.4.21.json'
          manifest='.github/staging/modrinth-standalone/manifest.json'
          test -s "$marker"; test -s "$manifest"
          jq --slurpfile proof "$marker" '
            ($proof[0].modules) as $published
            | .modules |= map(
                . as $module
                | ($published[] | select(.module == $module.id)) as $release
                | .version = $release.version
                | .jar = (.id + "-" + $release.version + ".jar")
                | .sha512 = $release.sha512
                | .changelog = ("Standalone " + .title + " " + $release.version + " from DeadRecall 2.4.21. Core 0.7 friendship services and the current lockstep gameplay fixes are validated from the immutable bundled build.")
              )
          ' "$manifest" > "$manifest.next"
          mv "$manifest.next" "$manifest"
          jq -e '.modules|length==11 and all(.[]; (.version|length)>0 and (.sha512|test("^[0-9a-f]{128}$")))' "$manifest" >/dev/null
          cp release-bundle/deadrecall-2.4.21-bundled.jar .github/staging/deadrecall-2.4.13-bundled.jar
          test "$(sha512sum .github/staging/deadrecall-2.4.13-bundled.jar | awk '{print $1}')" = '17f20a714c6b2e00512b686692adf7c1339964e4bc5cff3fd47a957e1eff7d8158c255ac1ddb89b2b781fb99045d59cb1c58ffec997eb497f90631a5b107cb67'
      - name: Synchronize and verify all eleven Modrinth projects
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_DRY_RUN: 'false'
        run: |
          set -euo pipefail
          chmod +x .github/scripts/sync-modrinth-standalone.sh
          .github/scripts/sync-modrinth-standalone.sh
      - name: Persist current standalone manifest and sync proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest='.github/staging/modrinth-standalone/manifest.json'
          manifest_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${manifest}"
          manifest_sha="$(curl --fail -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$manifest_api" | jq -er '.sha')"
          manifest_content="$(base64 -w0 < "$manifest")"
          payload="$(jq -n --arg m 'release: align standalone manifest with 2.4.21' --arg c "$manifest_content" --arg b "$GITHUB_REF_NAME" --arg s "$manifest_sha" '{message:$m,content:$c,branch:$b,sha:$s}')"
          curl --fail -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$manifest_api" -d "$payload" >/tmp/manifest-write.json
          new_commit="$(jq -er '.commit.sha' /tmp/manifest-write.json)"
          proof='.github/staging/modrinth-standalone-sync-2.4.21.json'
          proof_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${proof}"
          body="$(jq -n --arg bundle '2.4.21' --arg run "$GITHUB_RUN_ID" --arg manifest_commit "$new_commit" '{bundle_version:$bundle,verified_by_run:$run,manifest_commit:$manifest_commit,status:"verified"}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          old="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$proof_api" | jq -r '.sha//empty')"
          proof_payload="$(jq -n --arg m 'release: record standalone metadata sync 2.4.21' --arg c "$encoded" --arg b "$GITHUB_REF_NAME" --arg s "$old" 'if $s=="" then {message:$m,content:$c,branch:$b} else {message:$m,content:$c,branch:$b,sha:$s} end')"
          curl --fail -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$proof_api" -d "$proof_payload" >/dev/null
