name: Build

on:
  push:
    branches:
      - master
      - fix/**
      - release/**
      - migration/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        shell: bash
        run: |
          chmod +x gradlew
          chmod +x .github/scripts/build-current-bundle.sh
          chmod +x .github/scripts/smoke-current-bundle-server.sh
          chmod +x .github/scripts/publish-modrinth.sh

      - name: Verify transition metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$version" = '2.4.22'
          jq -e '
            .depends["totem-core"] == "=0.7.2"
            and .depends["totem-remnant"] == "=0.2.13"
            and .depends["totem-discord-bridge"] == "=0.1.8"
            and .depends["totem-automata"] == "=0.1.15"
            and .depends["totem-alchemy"] == "=0.1.26"
            and .depends["totem-enchanting"] == "=0.1.8"
            and .depends["totem-excavation"] == "=0.1.5"
            and .depends["totem-locksmith"] == "=0.1.4"
            and .depends["totem-vanilla-tweaks"] == "=0.1.10"
            and .depends["totem-nexus"] == "=0.3.0"
            and (.depends | has("totem-villagers") | not)
          ' src/main/resources/fabric.mod.json >/dev/null
          grep -F 'a8cedca207f9d4444ae4a52fd384ebd830fbd026' .github/scripts/build-current-bundle.sh >/dev/null

      - name: Rebuild exact ten-module transition bundle
        shell: bash
        run: bash .github/scripts/build-current-bundle.sh

      - name: Verify standalone Core compatibility ranges
        shell: bash
        run: |
          set -euo pipefail
          test "$(find standalone-modules -maxdepth 1 -type f -name '*.jar' | wc -l | tr -d ' ')" -eq 10
          test -f standalone-modules/totem-core-0.7.2.jar
          test ! -e standalone-modules/totem-villagers-0.1.32.jar
          for jar_file in standalone-modules/totem-*.jar; do
            module_id="$(unzip -p "$jar_file" fabric.mod.json | jq -er '.id')"
            if [[ "$module_id" == 'totem-core' ]]; then
              continue
            fi
            unzip -p "$jar_file" fabric.mod.json | jq -e \
              '.depends["totem-core"] == ">=0.7.0 <0.8.0"' >/dev/null
          done

      - name: Dedicated server transition smoke
        shell: bash
        run: bash .github/scripts/smoke-current-bundle-server.sh

      - name: Verify alias ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          host=build/libs/deadrecall-2.4.22-bundled.jar
          test -f "$host"
          test "$(unzip -Z1 "$host" 'META-INF/jars/*.jar' | wc -l | tr -d ' ')" -eq 10
          ! unzip -Z1 "$host" | grep -q 'DeadRecallLegacyItems.class'
          ! unzip -Z1 "$host" | grep -q 'LegacyMigratingItem.class'
          unzip -Z1 "$host" | grep -q 'LegacyAliasHandoffVerifier.class'
          unzip -p "$host" META-INF/jars/totem-core-0.7.2.jar > /tmp/totem-core.jar
          unzip -Z1 /tmp/totem-core.jar | grep -q 'dev/totem/core/migration/LegacyAliasBootstrap.class'
          unzip -Z1 /tmp/totem-core.jar | grep -q 'dev/totem/core/migration/LegacyAliasItem.class'
          unzip -Z1 /tmp/totem-core.jar | grep -q 'dev/totem/core/api/v1/migration/LegacyItemMigrationRegistry.class'

      - name: Generate SHA-512 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          sha512sum standalone-modules/*.jar build/libs/deadrecall-2.4.22-bundled.jar \
            | sort -k2 > build/release-evidence/2.4.22-sha512.txt
          cat build/release-evidence/2.4.22-sha512.txt

      - name: Upload transition bundle
        uses: actions/upload-artifact@v4
        with:
          name: deadrecall-2.4.22-transition
          path: |
            build/libs/deadrecall-2.4.22-bundled.jar
            build/release-evidence/2.4.22-sha512.txt
            standalone-modules/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Store failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transition-build-reports
          if-no-files-found: ignore
          path: |
            server-smoke.log
            **/build/reports/
            **/build/test-results/
            run/
