name: Discover Modrinth Projects

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  discover:
    if: startsWith(github.head_ref, 'release/modrinth-project-discovery-')
    runs-on: ubuntu-latest
    steps:
      - name: Query owned Modrinth projects
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN"
          api='https://api.modrinth.com/v2'
          args=(--fail --silent --show-error --retry 3 -H "Authorization: ${MODRINTH_TOKEN}" -H 'User-Agent: Yunitrish006006/Totem-release-orchestrator/1.0')
          curl "${args[@]}" "$api/user/Yunitrish006006/projects" > /tmp/projects.json
          jq '[.[] | {id,slug,title,status,project_type,versions}]' /tmp/projects.json > /tmp/owned.json
          marker='.github/staging/modrinth-owned-projects.json'
          encoded="$(base64 -w0 /tmp/owned.json)"
          old="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${marker}?ref=${TARGET_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$old" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker}" -f message='ci: record Modrinth project inventory' -f content="$encoded" -f branch="$TARGET_BRANCH" -f sha="$old" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker}" -f message='ci: record Modrinth project inventory' -f content="$encoded" -f branch="$TARGET_BRANCH" >/dev/null
          fi
