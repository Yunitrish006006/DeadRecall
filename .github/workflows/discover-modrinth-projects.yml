name: Discover Modrinth Projects

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  discover:
    if: startsWith(github.head_ref, 'release/modrinth-project-discovery-')
    runs-on: ubuntu-latest
    steps:
      - name: Query owned Modrinth projects and target versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN"
          test -n "$MODRINTH_PROJECT_ID"
          api='https://api.modrinth.com/v2'
          args=(--fail --silent --show-error --retry 3 -H "Authorization: ${MODRINTH_TOKEN}" -H 'User-Agent: Yunitrish006006/Totem-release-orchestrator/1.0')

          curl "${args[@]}" "$api/project/${MODRINTH_PROJECT_ID}/members" > /tmp/members.json
          user_id="$(jq -er 'map(select(.accepted == true))[0].user.id' /tmp/members.json)"
          curl "${args[@]}" "$api/user/${user_id}/projects" > /tmp/projects.json
          jq '[.[] | {id,slug,title,status,project_type,versions}]' /tmp/projects.json > /tmp/owned.json

          : > /tmp/targets.jsonl
          while IFS=$'\t' read -r slug project_id target_version; do
            curl "${args[@]}" "$api/project/${project_id}/version?include_changelog=false" > /tmp/versions.json
            jq -c --arg slug "$slug" --arg pid "$project_id" --arg target "$target_version" '
              {
                slug: $slug,
                project_id: $pid,
                target_version: $target,
                existing: ([.[] | select(.version_number == $target)] | length) > 0,
                match: ([.[] | select(.version_number == $target) | {
                  id,
                  version_number,
                  status,
                  game_versions,
                  loaders,
                  files: [.files[] | {filename,primary,sha512:.hashes.sha512}]
                }][0] // null),
                available_version_numbers: [.[] | .version_number]
              }
            ' /tmp/versions.json >> /tmp/targets.jsonl
          done <<'TARGETS'
          totem-remnant	dhochP34	0.2.13
          totem-discord-bridge	UBW4bpOx	0.1.8
          totem-automata	C8f15uNO	0.1.15
          totem-enchanting	CxaaO2xO	0.1.8
          totem-excavation	8JdAMczX	0.1.5
          totem-locksmith	7MXfMVJA	0.1.4
          totem-vanilla-tweaks	mEcpkZT2	0.1.10
          totem-nexus	FfCkJemY	0.3.0
          totem-villagers-workforce	kfuP4czk	0.1.32
          TARGETS
          jq -s '.' /tmp/targets.jsonl > /tmp/targets.json

          write_marker() {
            local source="$1"
            local marker="$2"
            local message="$3"
            local encoded old
            encoded="$(base64 -w0 "$source")"
            old="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${marker}?ref=${TARGET_BRANCH}" --jq '.sha' 2>/dev/null || true)"
            if [[ -n "$old" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker}" -f message="$message" -f content="$encoded" -f branch="$TARGET_BRANCH" -f sha="$old" >/dev/null
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker}" -f message="$message" -f content="$encoded" -f branch="$TARGET_BRANCH" >/dev/null
            fi
          }

          write_marker /tmp/owned.json '.github/staging/modrinth-owned-projects.json' 'ci: record Modrinth project inventory'
          write_marker /tmp/targets.json '.github/staging/modrinth-standalone-targets.json' 'ci: record standalone Modrinth target inventory'
