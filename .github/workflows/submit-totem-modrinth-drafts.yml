name: Submit Totem Modrinth Drafts

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  submit:
    if: startsWith(github.head_ref, 'release/modrinth-submit-drafts-')
    runs-on: ubuntu-latest
    steps:
      - name: Submit draft Totem projects for public review
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN"
          api='https://api.modrinth.com/v2'
          auth=(-H "Authorization: ${MODRINTH_TOKEN}" -H 'User-Agent: Yunitrish006006/Totem-release-orchestrator/1.0')
          : > /tmp/results.jsonl
          while IFS=$'\t' read -r slug project_id; do
            before="$(curl --fail --silent --show-error "${auth[@]}" "$api/project/${project_id}")"
            before_status="$(jq -er '.status' <<<"$before")"
            if [[ "$before_status" == 'draft' ]]; then
              curl --fail --silent --show-error -X PATCH "${auth[@]}" -H 'Content-Type: application/json' "$api/project/${project_id}" -d '{"requested_status":"approved"}' >/dev/null
            fi
            after="$(curl --fail --silent --show-error "${auth[@]}" "$api/project/${project_id}")"
            jq -nc --arg slug "$slug" --arg id "$project_id" --arg before "$before_status" --arg after "$(jq -er '.status' <<<"$after")" --arg requested "$(jq -r '.requested_status // ""' <<<"$after")" '{slug:$slug,project_id:$id,before_status:$before,after_status:$after,requested_status:$requested}' >> /tmp/results.jsonl
          done <<'PROJECTS'
          totem-alchemy	JnAGUw9w
          totem-vanilla-tweaks	mEcpkZT2
          PROJECTS
          jq -s '.' /tmp/results.jsonl > /tmp/results.json
          marker='.github/staging/modrinth-draft-submission.json'
          encoded="$(base64 -w0 /tmp/results.json)"
          old="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${marker}?ref=${TARGET_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$old" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker}" -f message='release: record Modrinth draft submissions' -f content="$encoded" -f branch="$TARGET_BRANCH" -f sha="$old" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker}" -f message='release: record Modrinth draft submissions' -f content="$encoded" -f branch="$TARGET_BRANCH" >/dev/null
          fi
