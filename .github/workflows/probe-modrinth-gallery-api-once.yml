name: Probe Modrinth Gallery API Once

on:
  push:
    branches: [master]
    paths: [.github/workflows/probe-modrinth-gallery-api-once.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe gallery add and patch
        id: probe
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/test.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="800" height="450"><rect width="800" height="450" fill="#11161c"/><text x="60" y="230" fill="white" font-family="sans-serif" font-size="52">TotemCore gallery API probe</text></svg>
          SVG
          api='https://api.modrinth.com/v2'
          project='ZggYV6cS'
          auth=(-H "Authorization: ${MODRINTH_TOKEN}" -H "User-Agent: Yunitrish006006/DeadRecall-gallery-probe/${GITHUB_RUN_ID}")
          uri() { jq -rn --arg v "$1" '$v|@uri'; }
          title='TotemCore gallery API probe'
          desc='Temporary API compatibility probe; safe to remove.'
          curl -sS "${auth[@]}" "$api/project/$project" >/tmp/project.json
          existing="$(jq -r --arg t "$title" 'first(.gallery[]?|select(.title==$t)|.url)//empty' /tmp/project.json)"
          if [[ -z "$existing" ]]; then
            status="$(curl -sS -o /tmp/response.json -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: image/svg+xml' --data-binary @/tmp/test.svg "$api/project/$project/gallery?ext=svg&featured=false&title=$(uri "$title")&description=$(uri "$desc")&ordering=999")"
            printf 'POST %s\n' "$status"
            cat /tmp/response.json || true
            if [[ "$status" == 204 ]]; then
              curl -sS "${auth[@]}" "$api/project/$project" >/tmp/project.json
              existing="$(jq -r --arg t "$title" 'first(.gallery[]?|select(.title==$t)|.url)//empty' /tmp/project.json)"
            fi
          else
            status='existing'
          fi
          patch_status='not-run'
          if [[ -n "$existing" ]]; then
            patch_status="$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH "${auth[@]}" "$api/project/$project/gallery?url=$(uri "$existing")&featured=false&title=$(uri "$title")&description=$(uri "$desc")&ordering=999")"
            printf 'PATCH %s\n' "$patch_status"
            cat /tmp/patch.json || true
          fi
          jq -n --arg run "$GITHUB_RUN_ID" --arg post "$status" --arg patch "$patch_status" --arg response "$(cat /tmp/response.json 2>/dev/null || true)" --arg patch_response "$(cat /tmp/patch.json 2>/dev/null || true)" --arg url "$existing" '{run:$run,post_status:$post,patch_status:$patch,post_response:$response,patch_response:$patch_response,url:$url}' >/tmp/proof.json
      - name: Record probe result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/staging/modrinth-gallery-api-probe.json'
          if [[ ! -s /tmp/proof.json ]]; then jq -n --arg run "$GITHUB_RUN_ID" '{run:$run,probe:"failed-before-proof"}' >/tmp/proof.json; fi
          content="$(base64 -w0 </tmp/proof.json)"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          old="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" | jq -r '.sha//empty')"
          payload="$(jq -n --arg m 'ci: record Modrinth gallery API probe' --arg c "$content" --arg b "$GITHUB_REF_NAME" --arg s "$old" 'if $s=="" then {message:$m,content:$c,branch:$b} else {message:$m,content:$c,branch:$b,sha:$s} end')"
          curl --fail -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$payload" >/dev/null
