name: Sync Standalone Galleries 2.4.21 V2

on:
  push:
    branches: [master]
    paths: [.github/workflows/sync-standalone-galleries-2.4.21-v2.yml]

permissions:
  contents: write

concurrency:
  group: sync-standalone-galleries-2.4.21-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate gallery cards and canonical manifest entries
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.sax.saxutils import escape

          manifest_path = Path('.github/staging/modrinth-standalone/manifest.json')
          gallery_dir = Path('.github/staging/modrinth-gallery')
          gallery_dir.mkdir(parents=True, exist_ok=True)
          manifest = json.loads(manifest_path.read_text())

          features = {
              'totem-core': ['Cross-module APIs and contracts', 'Shared friendship and invite service', 'Manuals, events, and version handshake'],
              'totem-remnant': ['Tiered modular backpacks', 'Death-item recovery and retention', 'Portable-container safety'],
              'totem-automata': ['Copper Golem sorting jobs', 'Mixed gathering storage and routing', 'Configurable tools, fuel, and targets'],
              'totem-nexus': ['Material-driven Space Unit travel', 'Maps, friends, and route safety', 'Capacity and stability diagnostics'],
              'totem-discord-bridge': ['Chat and lifecycle relay', 'Audit events and attachments', 'Live server status through HTTPS Worker'],
              'totem-alchemy': ['Heated cauldrons and brewing stands', 'Mixable potion states and reactions', 'Discovery-driven ingredients and manual'],
              'totem-enchanting': ['Content-based bookshelf power', 'Chiseled Bookshelf scaling', 'Clear visual enchanting feedback'],
              'totem-excavation': ['Seven hammer tiers', 'Reusable area selections', 'Bounded server-authoritative mining'],
              'totem-locksmith': ['Lock management GUI', 'Members, roles, and physical keys', 'Friends and automation access policies'],
              'totem-vanilla-tweaks': ['Server-validated container sorting', 'Concrete and bookshelf rule improvements', 'Furnace experience recovery'],
              'totem-villagers': ['Work-backed village economy', 'Real stock, crafting, and trading', 'Builders and resource logistics'],
          }
          previously_empty = {
              'totem-automata', 'totem-discord-bridge', 'totem-enchanting',
              'totem-excavation', 'totem-locksmith', 'totem-vanilla-tweaks'
          }

          for module in manifest['modules']:
              mid, title, version = module['id'], module['title'], module['version']
              bullets = features[mid]
              path = gallery_dir / f'{mid}-feature-overview.svg'
              overview_title = f'{title} feature overview'
              overview_description = (
                  f'Official feature overview for {title} {version} on Minecraft 26.2 / Fabric. '
                  'Informational card; not a gameplay screenshot.'
              )
              featured = mid in previously_empty
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
                <rect width="1600" height="900" fill="#11161c"/>
                <rect width="18" height="900" fill="#c99a4a"/>
                <rect x="96" y="96" width="1408" height="708" rx="28" fill="#19212a" stroke="#33404d" stroke-width="3"/>
                <text x="150" y="170" fill="#c99a4a" font-family="sans-serif" font-size="28" font-weight="700">TOTEM SERIES</text>
                <text x="150" y="270" fill="#f3f5f7" font-family="sans-serif" font-size="74" font-weight="700">{escape(title)}</text>
                <text x="150" y="326" fill="#aeb8c2" font-family="sans-serif" font-size="30">Version {escape(version)}  •  Minecraft 26.2  •  Fabric</text>
                <line x1="150" y1="380" x2="1450" y2="380" stroke="#33404d" stroke-width="2"/>
                <text x="150" y="450" fill="#f3f5f7" font-family="sans-serif" font-size="34" font-weight="700">Current features</text>
                <circle cx="168" cy="518" r="7" fill="#c99a4a"/><text x="195" y="529" fill="#d8dee5" font-family="sans-serif" font-size="32">{escape(bullets[0])}</text>
                <circle cx="168" cy="584" r="7" fill="#c99a4a"/><text x="195" y="595" fill="#d8dee5" font-family="sans-serif" font-size="32">{escape(bullets[1])}</text>
                <circle cx="168" cy="650" r="7" fill="#c99a4a"/><text x="195" y="661" fill="#d8dee5" font-family="sans-serif" font-size="32">{escape(bullets[2])}</text>
                <text x="150" y="735" fill="#82909d" font-family="sans-serif" font-size="23">Official feature overview • informational card, not a gameplay screenshot</text>
                <text x="1450" y="735" fill="#82909d" text-anchor="end" font-family="sans-serif" font-size="23">DeadRecall 2.4.21 lockstep</text>
              </svg>'''
              path.write_text(svg + '\n')

              gallery = module.setdefault('gallery', [])
              for item in gallery:
                  item['description'] = item.get('description', '').replace('DeadRecall 2.4.11', 'DeadRecall 2.4.21')
                  if mid == 'totem-core' and item.get('title') == 'Totem ecosystem integration':
                      item['description'] = 'The current shared Core contracts and eleven-module DeadRecall 2.4.21 integration map.'
                  if mid == 'totem-alchemy' and item.get('title') == 'Alchemy ingredients':
                      item['description'] = f'Alchemy ingredients, vessels, cauldron mixtures, and custom brews in {title} {version}.'
              gallery[:] = [g for g in gallery if g.get('title') != overview_title]
              gallery.append({
                  'file': str(path),
                  'title': overview_title,
                  'description': overview_description,
                  'featured': featured,
                  'ordering': 0 if featured else 90,
              })

          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY
          test "$(find .github/staging/modrinth-gallery -maxdepth 1 -name 'totem-*-feature-overview.svg' | wc -l)" = 11
          jq -e '.modules|length==11 and all(.[]; (.gallery|length)>=1)' .github/staging/modrinth-standalone/manifest.json >/dev/null

      - name: Synchronize gallery images with Modrinth
        id: gallery
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN"
          manifest='.github/staging/modrinth-standalone/manifest.json'
          api='https://api.modrinth.com/v2'
          auth=(-H "Authorization: ${MODRINTH_TOKEN}" -H "User-Agent: Yunitrish006006/DeadRecall-gallery-v2/${GITHUB_RUN_ID}")
          uri() { jq -rn --arg v "$1" '$v|@uri'; }

          mapfile -t modules < <(jq -r '.modules[].id' "$manifest")
          for module in "${modules[@]}"; do
            project="$(jq -er --arg id "$module" '.modules[]|select(.id==$id)|.existing_project_id' "$manifest")"
            curl --fail --silent --show-error --retry 3 "${auth[@]}" "$api/project/$project" >/tmp/project.json
            mapfile -t items < <(jq -c --arg id "$module" '.modules[]|select(.id==$id)|.gallery[]' "$manifest")
            for item in "${items[@]}"; do
              file="$(jq -er '.file' <<<"$item")"
              title="$(jq -er '.title' <<<"$item")"
              desc="$(jq -er '.description' <<<"$item")"
              featured="$(jq -r '.featured' <<<"$item")"
              ordering="$(jq -er '.ordering' <<<"$item")"
              test -s "$file"
              url="$(jq -r --arg t "$title" 'first(.gallery[]?|select(.title==$t)|.url)//empty' /tmp/project.json)"
              if [[ -z "$url" ]]; then
                ext="${file##*.}"
                case "$ext" in svg) mime='image/svg+xml';; png) mime='image/png';; jpg|jpeg) mime='image/jpeg';; webp) mime='image/webp';; *) mime='application/octet-stream';; esac
                curl --fail --silent --show-error --retry 3 -X POST "${auth[@]}" -H "Content-Type: $mime" --data-binary "@$file" \
                  "$api/project/$project/gallery?ext=$ext&featured=$featured&title=$(uri "$title")&description=$(uri "$desc")&ordering=$ordering" >/dev/null
                curl --fail --silent --show-error --retry 3 "${auth[@]}" "$api/project/$project" >/tmp/project.json
                url="$(jq -er --arg t "$title" 'first(.gallery[]|select(.title==$t)|.url)' /tmp/project.json)"
              fi
              curl --fail --silent --show-error --retry 3 -X PATCH "${auth[@]}" \
                "$api/project/$project/gallery?url=$(uri "$url")&featured=$featured&title=$(uri "$title")&description=$(uri "$desc")&ordering=$ordering" >/dev/null
              curl --fail --silent --show-error --retry 3 "${auth[@]}" "$api/project/$project" >/tmp/project.json
            done
            title="$(jq -er --arg id "$module" '.modules[]|select(.id==$id)|.title' "$manifest")"
            jq -e --arg t "$title feature overview" '(.gallery|length)>=1 and any(.gallery[];.title==$t)' /tmp/project.json >/dev/null
            jq -e 'all(.gallery[];((.description//"")|contains("2.4.11")|not))' /tmp/project.json >/dev/null
            echo "$module: $(jq '.gallery|length' /tmp/project.json) gallery images"
          done

      - name: Verify every project and prepare proof
        id: verify
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          manifest='.github/staging/modrinth-standalone/manifest.json'
          api='https://api.modrinth.com/v2'
          auth=(-H "Authorization: ${MODRINTH_TOKEN}" -H "User-Agent: Yunitrish006006/DeadRecall-gallery-verify/${GITHUB_RUN_ID}")
          projects='[]'
          while IFS='|' read -r module project title; do
            curl --fail --silent --show-error --retry 3 "${auth[@]}" "$api/project/$project" >/tmp/project.json
            count="$(jq -er '.gallery|length' /tmp/project.json)"
            test "$count" -ge 1
            jq -e --arg t "$title feature overview" 'any(.gallery[];.title==$t)' /tmp/project.json >/dev/null
            jq -e 'all(.gallery[];((.description//"")|contains("2.4.11")|not))' /tmp/project.json >/dev/null
            featured="$(jq '[.gallery[]|select(.featured)]|length' /tmp/project.json)"
            projects="$(jq -c --arg m "$module" --arg p "$project" --argjson c "$count" --argjson f "$featured" '.+[{module:$m,project_id:$p,gallery_count:$c,featured_count:$f}]' <<<"$projects")"
          done < <(jq -r '.modules[]|[.id,.existing_project_id,.title]|join("|")' "$manifest")
          test "$(jq 'length' <<<"$projects")" = 11
          jq -n --arg bundle '2.4.21' --arg run "$GITHUB_RUN_ID" --argjson projects "$projects" '{bundle_version:$bundle,verified_by_run:$run,status:"verified",projects:$projects}' > .github/staging/modrinth-gallery-sync-2.4.21.json

      - name: Persist canonical gallery state
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/staging/modrinth-gallery/*-feature-overview.svg .github/staging/modrinth-standalone/manifest.json .github/staging/modrinth-gallery-sync-2.4.21.json
          if ! git diff --cached --quiet; then
            git commit -m 'release: add complete standalone Modrinth galleries'
            git push origin HEAD:master
          fi

      - name: Record observable gallery workflow outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE: ${{ steps.generate.outcome }}
          GALLERY: ${{ steps.gallery.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PERSIST: ${{ steps.persist.outcome }}
        run: |
          set -euo pipefail
          path='.github/staging/modrinth-gallery-sync-v2-outcome.json'
          body="$(jq -n --arg run "$GITHUB_RUN_ID" --arg generate "$GENERATE" --arg gallery "$GALLERY" --arg verify "$VERIFY" --arg persist "$PERSIST" '{run:$run,generate:$generate,gallery:$gallery,verify:$verify,persist:$persist}')"
          content="$(printf '%s\n' "$body" | base64 -w0)"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          old="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" | jq -r '.sha//empty')"
          payload="$(jq -n --arg message 'release: record gallery sync outcome' --arg content "$content" --arg branch "$GITHUB_REF_NAME" --arg sha "$old" 'if $sha=="" then {message:$message,content:$content,branch:$branch} else {message:$message,content:$content,branch:$branch,sha:$sha} end')"
          curl --fail -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$payload" >/dev/null
