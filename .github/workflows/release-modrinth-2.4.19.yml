name: Release DeadRecall 2.4.19 to Modrinth

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-modrinth-2.4.19.yml'

permissions:
  contents: read

concurrency:
  group: deadrecall-modrinth-2.4.19-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, smoke, sync, and publish 2.4.19
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out DeadRecall
        uses: actions/checkout@v4

      - name: Assert release version
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = '2.4.19'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build exact lockstep bundle
        shell: bash
        run: bash .github/scripts/build-current-bundle.sh

      - name: Dedicated server smoke
        shell: bash
        run: bash .github/scripts/smoke-current-bundle-server.sh

      - name: Validate release artifact
        shell: bash
        env:
          MODRINTH_DRY_RUN: 'true'
          MODRINTH_ARTIFACT: ${{ env.DEADRECALL_BUNDLE_ARTIFACT }}
          MODRINTH_VERSION_TYPE: release
        run: bash .github/scripts/publish-modrinth.sh

      - name: Verify Modrinth credentials
        shell: bash
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MODRINTH_PROJECT_ID}" || { echo 'MODRINTH_PROJECT_ID is missing.' >&2; exit 1; }
          test -n "${MODRINTH_TOKEN}" || { echo 'MODRINTH_TOKEN is missing.' >&2; exit 1; }

      - name: Sync current project presentation
        shell: bash
        env:
          MODRINTH_PROJECT_DRY_RUN: 'false'
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/sync-modrinth-project.sh

      - name: Publish DeadRecall 2.4.19
        id: modrinth
        shell: bash
        env:
          MODRINTH_DRY_RUN: 'false'
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_VERSION_TYPE: release
          MODRINTH_ARTIFACT: ${{ env.DEADRECALL_BUNDLE_ARTIFACT }}
        run: bash .github/scripts/publish-modrinth.sh

      - name: Verify live 2.4.19 artifact
        shell: bash
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_VERSION_ID: ${{ steps.modrinth.outputs.version_id }}
          MODRINTH_ARTIFACT: ${{ env.DEADRECALL_BUNDLE_ARTIFACT }}
        run: |
          set -euo pipefail
          test -n "${MODRINTH_VERSION_ID}"
          expected_sha512="$(sha512sum "${MODRINTH_ARTIFACT}" | awk '{print $1}')"
          response="$(mktemp)"
          trap 'rm -f "${response}"' EXIT

          curl --silent --show-error --fail --retry 3 \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${GITHUB_REPOSITORY}-ReleaseVerify/${GITHUB_RUN_ID}" \
            --output "${response}" \
            "https://api.modrinth.com/v2/version/${MODRINTH_VERSION_ID}"

          jq -e \
            --arg project_id "${MODRINTH_PROJECT_ID}" \
            --arg version_id "${MODRINTH_VERSION_ID}" \
            --arg sha512 "${expected_sha512}" '
              .id == $version_id
              and .project_id == $project_id
              and .name == "DeadRecall 2.4.19"
              and .version_number == "2.4.19"
              and .version_type == "release"
              and .status == "listed"
              and .environment == "client_and_server"
              and .game_versions == ["26.2"]
              and .loaders == ["fabric"]
              and (([.files[] | select(.primary == true)][0] // .files[0]).filename == "deadrecall-2.4.19-bundled.jar")
              and (([.files[] | select(.primary == true)][0] // .files[0]).hashes.sha512 == $sha512)
            ' "${response}" >/dev/null

          echo "Verified live DeadRecall 2.4.19 SHA-512: ${expected_sha512}"

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadrecall-modrinth-2.4.19-release-failure
          if-no-files-found: ignore
          path: |
            server-smoke.log
            build/current-bundle.fabric.mod.json
            run/logs/
            **/build/reports/
