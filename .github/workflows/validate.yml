name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check modularization compatibility baseline
        run: bash .github/scripts/check-modularization-baseline.sh

      - name: Check feature dependency boundaries
        run: bash .github/scripts/check-feature-dependency-boundaries.sh

      - name: Check lockstep compatibility manifest
        run: bash .github/scripts/check-lockstep-manifest.sh

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        shell: bash
        run: |
          # Keep a stuck GameTest shutdown diagnosable instead of consuming the entire job.
          timeout --signal=TERM --kill-after=30s 15m \
            ./gradlew build --no-daemon --stacktrace

      - name: Check assembled compatibility surface
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          bash .github/scripts/check-assembled-compatibility-surface.sh \
            --jar "build/libs/deadrecall-${version}.jar" \
            --source-root . \
            --allow-delegated-surface

      - name: Upload test, GameTest and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          if-no-files-found: ignore
          path: |
            build/reports/**
            build/test-results/**
            run/gametest/**
            test-artifacts/screenshots/**

  assembled-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout DeadRecall compatibility bundle
        uses: actions/checkout@v4

      - name: Checkout pinned TotemCore source
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 1d055144f9f2b9dcd79d8bb44479ce76e3c242bc
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Checkout pinned TotemDiscordBridge source
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemDiscordBridge
          ref: 0ba1e98d06c936a8032fa16eb84498453a3d5018
          path: .lockstep/TotemDiscordBridge
          persist-credentials: false

      - name: Checkout pinned TotemAutomata source
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemAutomata
          ref: 31b257707da0a04d8fd1efa006ca1b1ca8e8bcc7
          path: .lockstep/TotemAutomata
          persist-credentials: false

      - name: Checkout pinned TotemNexus source
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemNexus
          ref: 3e3a24a5803e13c4e020443ff1f8838c03a46723
          path: .lockstep/TotemNexus
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build exact pinned graph
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Discord's pinned source uses Core as a source set.  Copy this
          # detached Core checkout only into the disposable CI worktree.
          mkdir -p .lockstep/TotemDiscordBridge/TotemCore
          cp -a .lockstep/TotemCore/. .lockstep/TotemDiscordBridge/TotemCore/

          ./gradlew jar remapGametestJar --no-daemon --stacktrace
          # Core needs Loom's remapped production JAR in build/libs. The other
          # split-source-set compatibility projects publish their production
          # JARs directly through `jar` and do not expose a remapJar task.
          ./gradlew -p .lockstep/TotemCore remapJar --no-daemon --stacktrace
          test -f .lockstep/TotemCore/build/libs/totem-core-0.1.2.jar
          ./gradlew -p .lockstep/TotemDiscordBridge jar --no-daemon --stacktrace
          ./gradlew -p .lockstep/TotemAutomata \
            -PtotemCoreJar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.1.2.jar" \
            jar --no-daemon --stacktrace
          ./gradlew -p .lockstep/TotemNexus \
            -PtotemCoreJar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.1.2.jar" \
            jar --no-daemon --stacktrace
          test -f .lockstep/TotemDiscordBridge/build/libs/totem-discord-bridge-0.1.1.jar
          test -f .lockstep/TotemAutomata/build/libs/totem-automata-0.1.1.jar
          test -f .lockstep/TotemNexus/build/libs/totem-nexus-0.1.1.jar

      - name: Verify module-owned resources survive artifact packaging
        shell: bash
        run: |
          bash .github/scripts/check-module-artifact-resources.sh \
            --source-root .lockstep/TotemDiscordBridge \
            --jar .lockstep/TotemDiscordBridge/build/libs/totem-discord-bridge-0.1.1.jar
          bash .github/scripts/check-module-artifact-resources.sh \
            --source-root .lockstep/TotemAutomata \
            --jar .lockstep/TotemAutomata/build/libs/totem-automata-0.1.1.jar
          bash .github/scripts/check-module-artifact-resources.sh \
            --source-root .lockstep/TotemNexus \
            --jar .lockstep/TotemNexus/build/libs/totem-nexus-0.1.1.jar

      - name: Download Fabric Dedicated Server launcher
        shell: bash
        run: |
          curl -fL --retry 3 \
            --output "${RUNNER_TEMP}/fabric-server-launch.jar" \
            https://meta.fabricmc.net/v2/versions/loader/26.2/0.19.3/1.1.0/server/jar

      - name: Verify exact-version assembled compatibility bundle
        shell: bash
        run: |
          set -euo pipefail
          fabric_api_jar="$(find "${HOME}/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api/0.154.2+26.2" \
            -name 'fabric-api-0.154.2+26.2.jar' -print -quit)"
          test -n "${fabric_api_jar}"
          test -f "${fabric_api_jar}"
          bundle_root="${RUNNER_TEMP}/deadrecall-lockstep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          bash .github/scripts/verify-lockstep-bundle.sh \
            --output "${bundle_root}" \
            --java java \
            --deadrecall build/libs/deadrecall-2.4.1.jar \
            --fabric-api "${fabric_api_jar}" \
            --server-launcher "${RUNNER_TEMP}/fabric-server-launch.jar" \
            --source totem-core=.lockstep/TotemCore \
            --source totem-discord-bridge=.lockstep/TotemDiscordBridge \
            --source totem-automata=.lockstep/TotemAutomata \
            --source totem-nexus=.lockstep/TotemNexus \
            --artifact totem-core=.lockstep/TotemCore/build/libs/totem-core-0.1.2.jar \
            --artifact totem-discord-bridge=.lockstep/TotemDiscordBridge/build/libs/totem-discord-bridge-0.1.1.jar \
            --artifact totem-automata=.lockstep/TotemAutomata/build/libs/totem-automata-0.1.1.jar \
            --artifact totem-nexus=.lockstep/TotemNexus/build/libs/totem-nexus-0.1.1.jar

      - name: Verify legacy Copper Golem world through Automata cutover
        shell: bash
        run: |
          set -euo pipefail
          marker_root="${RUNNER_TEMP}/legacy-automata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          legacy_marker="${marker_root}/legacy"
          migration_marker="${marker_root}/migration"
          legacy_run="run/copperRestartProbe"
          migration_bundle="${RUNNER_TEMP}/legacy-automata-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          verification_bundle="${RUNNER_TEMP}/legacy-automata-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${marker_root}" "${legacy_run}" "${migration_bundle}" "${verification_bundle}"
          mkdir -p "${legacy_marker}" "${migration_marker}" "${legacy_run}"
          printf '%s\n' 'eula=true' > "${legacy_run}/eula.txt"
          printf '%s\n' 'server-port=25571' > "${legacy_run}/server.properties"

          DEADRECALL_COPPER_RESTART_PROBE_PHASE=seed \
          DEADRECALL_COPPER_RESTART_PROBE_MARKER_DIR="${legacy_marker}" \
            ./gradlew runCopperRestartProbe --no-daemon --stacktrace
          test -f "${legacy_marker}/seed.ok"
          test ! -f "${legacy_marker}/seed.failure"

          fabric_api_jar="$(find "${HOME}/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api/0.154.2+26.2" \
            -name 'fabric-api-0.154.2+26.2.jar' -print -quit)"
          test -n "${fabric_api_jar}"
          test -f "${fabric_api_jar}"

          bash .github/scripts/verify-lockstep-bundle.sh \
            --output "${migration_bundle}" \
            --java java \
            --deadrecall build/libs/deadrecall-2.4.1.jar \
            --fabric-api "${fabric_api_jar}" \
            --server-launcher "${RUNNER_TEMP}/fabric-server-launch.jar" \
            --world "${legacy_run}/world" \
            --extra-mod build/libs/deadrecall-2.4.1-gametest.jar \
            --environment "DEADRECALL_LEGACY_AUTOMATA_MIGRATION_PHASE=migrate" \
            --environment "DEADRECALL_LEGACY_AUTOMATA_LEGACY_MARKER_DIR=${legacy_marker}" \
            --environment "DEADRECALL_LEGACY_AUTOMATA_PROBE_MARKER_DIR=${migration_marker}" \
            --completion-marker "${migration_marker}/migrate.ok" \
            --source totem-core=.lockstep/TotemCore \
            --source totem-discord-bridge=.lockstep/TotemDiscordBridge \
            --source totem-automata=.lockstep/TotemAutomata \
            --source totem-nexus=.lockstep/TotemNexus \
            --artifact totem-core=.lockstep/TotemCore/build/libs/totem-core-0.1.2.jar \
            --artifact totem-discord-bridge=.lockstep/TotemDiscordBridge/build/libs/totem-discord-bridge-0.1.1.jar \
            --artifact totem-automata=.lockstep/TotemAutomata/build/libs/totem-automata-0.1.1.jar \
            --artifact totem-nexus=.lockstep/TotemNexus/build/libs/totem-nexus-0.1.1.jar

          bash .github/scripts/verify-lockstep-bundle.sh \
            --output "${verification_bundle}" \
            --java java \
            --deadrecall build/libs/deadrecall-2.4.1.jar \
            --fabric-api "${fabric_api_jar}" \
            --server-launcher "${RUNNER_TEMP}/fabric-server-launch.jar" \
            --world "${migration_bundle}/server/world" \
            --extra-mod build/libs/deadrecall-2.4.1-gametest.jar \
            --environment "DEADRECALL_LEGACY_AUTOMATA_MIGRATION_PHASE=verify" \
            --environment "DEADRECALL_LEGACY_AUTOMATA_LEGACY_MARKER_DIR=${legacy_marker}" \
            --environment "DEADRECALL_LEGACY_AUTOMATA_PROBE_MARKER_DIR=${migration_marker}" \
            --completion-marker "${migration_marker}/verify.ok" \
            --source totem-core=.lockstep/TotemCore \
            --source totem-discord-bridge=.lockstep/TotemDiscordBridge \
            --source totem-automata=.lockstep/TotemAutomata \
            --source totem-nexus=.lockstep/TotemNexus \
            --artifact totem-core=.lockstep/TotemCore/build/libs/totem-core-0.1.2.jar \
            --artifact totem-discord-bridge=.lockstep/TotemDiscordBridge/build/libs/totem-discord-bridge-0.1.1.jar \
            --artifact totem-automata=.lockstep/TotemAutomata/build/libs/totem-automata-0.1.1.jar \
            --artifact totem-nexus=.lockstep/TotemNexus/build/libs/totem-nexus-0.1.1.jar
          test -f "${migration_marker}/migrate.ok"
          test -f "${migration_marker}/verify.ok"
          test ! -f "${migration_marker}/migrate.failure"
          test ! -f "${migration_marker}/verify.failure"

      - name: Verify legacy Nexus world through Nexus cutover
        shell: bash
        run: |
          set -euo pipefail
          marker_root="${RUNNER_TEMP}/legacy-nexus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          legacy_run="run/nexusRestartProbe"
          migration_bundle="${RUNNER_TEMP}/legacy-nexus-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          verification_bundle="${RUNNER_TEMP}/legacy-nexus-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${marker_root}" "${legacy_run}" "${migration_bundle}" "${verification_bundle}"
          mkdir -p "${marker_root}" "${legacy_run}"
          printf '%s\n' 'eula=true' > "${legacy_run}/eula.txt"
          printf '%s\n' 'server-port=25571' > "${legacy_run}/server.properties"

          DEADRECALL_LEGACY_NEXUS_MIGRATION_PHASE=seed \
          DEADRECALL_LEGACY_NEXUS_PROBE_MARKER_DIR="${marker_root}" \
            ./gradlew runNexusRestartProbe --no-daemon --stacktrace
          test -f "${marker_root}/seed.ok"
          test ! -f "${marker_root}/seed.failure"

          fabric_api_jar="$(find "${HOME}/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api/0.154.2+26.2" \
            -name 'fabric-api-0.154.2+26.2.jar' -print -quit)"
          test -n "${fabric_api_jar}"
          test -f "${fabric_api_jar}"

          bash .github/scripts/verify-lockstep-bundle.sh \
            --output "${migration_bundle}" \
            --java java \
            --deadrecall build/libs/deadrecall-2.4.1.jar \
            --fabric-api "${fabric_api_jar}" \
            --server-launcher "${RUNNER_TEMP}/fabric-server-launch.jar" \
            --world "${legacy_run}/world" \
            --extra-mod build/libs/deadrecall-2.4.1-gametest.jar \
            --environment "DEADRECALL_LEGACY_NEXUS_MIGRATION_PHASE=migrate" \
            --environment "DEADRECALL_LEGACY_NEXUS_PROBE_MARKER_DIR=${marker_root}" \
            --completion-marker "${marker_root}/migrate.ok" \
            --source totem-core=.lockstep/TotemCore \
            --source totem-discord-bridge=.lockstep/TotemDiscordBridge \
            --source totem-automata=.lockstep/TotemAutomata \
            --source totem-nexus=.lockstep/TotemNexus \
            --artifact totem-core=.lockstep/TotemCore/build/libs/totem-core-0.1.2.jar \
            --artifact totem-discord-bridge=.lockstep/TotemDiscordBridge/build/libs/totem-discord-bridge-0.1.1.jar \
            --artifact totem-automata=.lockstep/TotemAutomata/build/libs/totem-automata-0.1.1.jar \
            --artifact totem-nexus=.lockstep/TotemNexus/build/libs/totem-nexus-0.1.1.jar

          bash .github/scripts/verify-lockstep-bundle.sh \
            --output "${verification_bundle}" \
            --java java \
            --deadrecall build/libs/deadrecall-2.4.1.jar \
            --fabric-api "${fabric_api_jar}" \
            --server-launcher "${RUNNER_TEMP}/fabric-server-launch.jar" \
            --world "${migration_bundle}/server/world" \
            --extra-mod build/libs/deadrecall-2.4.1-gametest.jar \
            --environment "DEADRECALL_LEGACY_NEXUS_MIGRATION_PHASE=verify" \
            --environment "DEADRECALL_LEGACY_NEXUS_PROBE_MARKER_DIR=${marker_root}" \
            --completion-marker "${marker_root}/verify.ok" \
            --source totem-core=.lockstep/TotemCore \
            --source totem-discord-bridge=.lockstep/TotemDiscordBridge \
            --source totem-automata=.lockstep/TotemAutomata \
            --source totem-nexus=.lockstep/TotemNexus \
            --artifact totem-core=.lockstep/TotemCore/build/libs/totem-core-0.1.2.jar \
            --artifact totem-discord-bridge=.lockstep/TotemDiscordBridge/build/libs/totem-discord-bridge-0.1.1.jar \
            --artifact totem-automata=.lockstep/TotemAutomata/build/libs/totem-automata-0.1.1.jar \
            --artifact totem-nexus=.lockstep/TotemNexus/build/libs/totem-nexus-0.1.1.jar
          test -f "${marker_root}/migrate.ok"
          test -f "${marker_root}/verify.ok"
          test ! -f "${marker_root}/migrate.failure"
          test ! -f "${marker_root}/verify.failure"

      - name: Upload assembled-bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembled-bundle-evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/deadrecall-lockstep-*/server/console.log
            ${{ runner.temp }}/deadrecall-lockstep-*/server/logs/**
            ${{ runner.temp }}/deadrecall-lockstep-*/server/crash-reports/**
            ${{ runner.temp }}/legacy-automata-*/**
            ${{ runner.temp }}/legacy-nexus-*/**
            .lockstep/TotemCore/build/libs/*.jar
            .lockstep/TotemDiscordBridge/build/libs/*.jar
            .lockstep/TotemAutomata/build/libs/*.jar
            .lockstep/TotemNexus/build/libs/*.jar
