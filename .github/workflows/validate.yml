name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  staged-release:
    name: Verify staged release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify standalone projects
        shell: bash
        env:
          MODRINTH_DRY_RUN: 'true'
        run: |
          set -euo pipefail
          bash .github/scripts/sync-modrinth-standalone.sh

      - name: Verify DeadRecall release
        shell: bash
        env:
          MODRINTH_DRY_RUN: 'true'
          MODRINTH_PROJECT_ID: dry-run-project
          MODRINTH_ARTIFACT: .github/staging/deadrecall-2.4.11-bundled.jar
        run: |
          set -euo pipefail
          unzip -t "${MODRINTH_ARTIFACT}"
          bash .github/scripts/publish-modrinth.sh

      - name: Verify bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          artifact=.github/staging/deadrecall-2.4.11-bundled.jar
          test "$(unzip -p "${artifact}" fabric.mod.json | jq -r '.id')" = deadrecall
          test "$(unzip -p "${artifact}" fabric.mod.json | jq -r '.version')" = 2.4.11
          test "$(unzip -p "${artifact}" fabric.mod.json | jq -r '.license')" = Apache-2.0
          test "$(unzip -Z1 "${artifact}" 'META-INF/jars/*.jar' | wc -l)" = 11

      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: deadrecall-2.4.11-bundled
          path: .github/staging/deadrecall-2.4.11-bundled.jar
          if-no-files-found: error
