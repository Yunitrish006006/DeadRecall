name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - migration/**
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  staged-release:
    name: Verify staged release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify current transition graph
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "${version}" = '2.4.22'
          test -f "docs/releases/${version}.md"
          grep -F -- "- [${version}](${version}.md)" docs/releases/README.md >/dev/null

          mapfile -t module_pins < <(jq -r '
            .depends
            | to_entries[]
            | select(.key | startswith("totem-"))
            | [.key, .value]
            | @tsv
          ' src/main/resources/fabric.mod.json)
          test "${#module_pins[@]}" -eq 10

          for pin in "${module_pins[@]}"; do
            module_id="${pin%%$'\t'*}"
            exact_version="${pin#*$'\t'}"
            case "${exact_version}" in
              =*) exact_version="${exact_version#=}" ;;
              *) echo "Non-exact Totem dependency: ${module_id} ${exact_version}" >&2; exit 1 ;;
            esac
            grep -F -- "\"${module_id}-${exact_version}.jar\"" build.gradle >/dev/null
          done

          test "$(jq '.migrations | length' src/main/resources/data/deadrecall/migration/item_ids.json)" -eq 14
          jq -e '.depends["totem-core"] == "=0.7.2" and (.depends | has("totem-villagers") | not)' \
            src/main/resources/fabric.mod.json >/dev/null
          ! grep -F 'totem-villagers-0.1.32.jar' build.gradle >/dev/null
          ! grep -F 'checkout_source TotemVillagers' .github/scripts/build-current-bundle.sh >/dev/null

          echo "Validated DeadRecall ${version} ten-module transition graph and 14-item alias manifest."

      - name: Verify archived standalone projects
        if: ${{ hashFiles('.github/staging/deadrecall-2.4.13-bundled.jar') != '' }}
        shell: bash
        env:
          MODRINTH_DRY_RUN: 'true'
        run: bash .github/scripts/sync-modrinth-standalone.sh
